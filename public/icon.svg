<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" />

  <!-- Database / Tables Graphic -->
  <g transform="translate(106, 96)" filter="url(#glow)">
    <!-- Top Cylinder -->
    <ellipse cx="150" cy="50" rx="130" ry="40" fill="url(#accentGrad)" />
    <path d="M 20,50 v 50 c 0,22.09 58.2,40 130,40 71.8,0 130,-17.91 130,-40 V 50 Z" fill="#2563eb" opacity="0.85" />
    <ellipse cx="150" cy="100" rx="130" ry="40" fill="none" stroke="#93c5fd" stroke-width="4" opacity="0.6" />

    <!-- Middle Cylinder -->
    <path d="M 20,130 v 50 c 0,22.09 58.2,40 130,40 71.8,0 130,-17.91 130,-40 V 130 Z" fill="#1d4ed8" opacity="0.9" />
    <ellipse cx="150" cy="180" rx="130" ry="40" fill="none" stroke="#93c5fd" stroke-width="4" opacity="0.6" />

    <!-- Bottom Cylinder -->
    <path d="M 20,210 v 50 c 0,22.09 58.2,40 130,40 71.8,0 130,-17.91 130,-40 V 210 Z" fill="#1e40af" />
  </g>

  <!-- Grid overlay -->
  <g transform="translate(180, 240)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <!-- Table columns grid -->
    <rect x="0" y="0" width="150" height="110" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="5" />
    <line x1="0" y1="36" x2="150" y2="36" stroke="#38bdf8" stroke-width="4" />
    <line x1="50" y1="0" x2="50" y2="110" stroke="#334155" stroke-width="3" />
    <line x1="100" y1="0" x2="100" y2="110" stroke="#334155" stroke-width="3" />
    <line x1="0" y1="72" x2="150" y2="72" stroke="#334155" stroke-width="3" />
  </g>

  <!-- DAEWOO Text -->
  <text x="256" y="440" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="6">DAEWOO</text>
</svg>
